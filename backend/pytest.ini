[pytest]
# Tests import from the backend/ package root (same way main.py does:
# `from services.forecasting import ...`). Add backend/ to sys.path so
# imports resolve without an installed package.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Keep output quiet by default; use `pytest -v` for verbose.
addopts = -ra
